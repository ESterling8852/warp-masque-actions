name: Sync Upstream

on:
  schedule:
    # 每天 UTC 0:00 自动运行一次（可根据 Cron 表达式自由调节）
    - cron: '0 0 * * *'
  # 支持在 GitHub 页面手动点击触发同步
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          # 设置为你 Fork 仓库的主分支名（如 main 或 master）
          ref: main
          # 需要设置足够深的 commit 深度以便合并
          fetch-depth: 0

      - name: Sync upstream changes
        run: |
          # 配置 Git 用户信息
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 添加上游仓库地址（替换为原作者仓库的 HTTPS 链接）
          git remote add upstream https://github.com/byJoey/warp-masque-actions.git
          
          # 获取上游更新
          git fetch upstream
          
          # 将上游主分支合并到当前分支（替换为上游主分支名，如 upstream/main）
          git merge upstream/main --no-edit
          
          # 推送到你自己的 Fork 仓库
          git push origin main
